name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'

jobs:
  backend:
    name: Go build / test / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Frontend must be built before the backend so the go:embed of web/dist
      # has content to embed. We only need the static bundle here, not deps for
      # the embed step beyond what build produces.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (for embed)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: go vet
        run: go vet ./...

      - name: go build
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: go test -race
        env:
          CGO_ENABLED: '1' # -race requires cgo for the race detector instrumentation
        run: go test -race ./...

      - name: sqlc diff (generated code up-to-date)
        uses: sqlc-dev/setup-sqlc@v4
        with:
          # Pin to the version the team generates with; a mismatch makes
          # `sqlc diff` fail on otherwise-current code.
          sqlc-version: '1.31.1'
      - name: Verify sqlc generated code is current
        run: sqlc diff

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # golangci-lint v2 (action v7+). Match the version the team runs locally.
          version: v2.11.3
          args: --timeout=5m

  frontend:
    name: Frontend test / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Unit tests
        working-directory: web
        run: npm run test:run

      - name: Production build
        working-directory: web
        run: npm run build
