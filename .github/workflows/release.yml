name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the GitHub Release and upload assets

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # `make release` builds the frontend bundle once (web/dist), embeds it,
      # then cross-compiles every target, so no separate frontend step is needed.
      - name: Build release artifacts
        env:
          # The tag (e.g. v0.2.0) is the version baked into the binary and asset names.
          VERSION: ${{ github.ref_name }}
        run: make release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Attach the cross-built tarballs and the checksum manifest.
          files: |
            dist/fs-image-manager_*_*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
